<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split-da-money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <h1>&#9733; <span>Split</span>-da-money</h1>
  <div class="tools">
    <button id="link" class="px L btn orange" type="button">Copy link</button>
    <button id="export" class="px L btn blue" type="button" disabled>Export picture</button>
  </div>
</header>

<main>
  <section class="px L panel" style="--fill:var(--peach)">
    <div class="px L pill">1. How many friends?</div>
    <div class="setup">
      <div class="px M field num"><input id="nf" type="number" min="2" max="30" value="4" aria-label="Number of friends"></div>
      <button id="reset" class="px M btn" type="button" style="--fill:var(--cream)">Clear amounts</button>
    </div>
  </section>

  <section class="px L panel" style="--fill:var(--sage)">
    <div class="px L pill">2. What did each friend pay?</div>
    <p class="hint">Add one line per expense. The reason is optional (₹).</p>
    <div class="cols" id="cols"></div>
  </section>

  <section class="px L panel" style="--fill:var(--peach)">
    <div class="px L pill">3. Who pays whom</div>
    <div class="px M summary" id="summary" hidden></div>
    <ul id="settle"><li class="px M">Type the amounts above.</li></ul>
  </section>
</main>

<div id="toast" class="px M toast" role="status" hidden></div>

<script src="script.js"></script>
</body>
</html>

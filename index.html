<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split-da-money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <h1>&#9733; <span>Split</span>-da-money</h1>
  <div class="tools">
    <button id="link" class="px L btn orange" type="button">Copy link</button>
    <button id="export" class="px L btn blue" type="button" disabled>Export picture</button>
    <button id="export-pdf" class="px L btn blue" type="button" disabled>Export PDF</button>
    <button id="layout-reset" class="px L btn" type="button" style="--fill:var(--cream)">Reset layout</button>
    <label class="px M toggle"><input id="preview" type="checkbox" checked> Preview first</label>
  </div>
</header>

<main id="board">
  <section class="px L panel" data-panel="friends" style="--fill:var(--sage)">
    <div class="gi-in">
      <div class="px L pill">1. What did each friend pay?</div>
      <p class="hint">Add one line per expense. The reason is optional (₹). Press &lsaquo; to leave friends out of an expense.
        Drag the dotted handle to move a block and its bottom-right corner to resize it.</p>
      <div class="setup">
        <button id="add-friend" class="px M btn" type="button">+ Add friend</button>
        <button id="reset" class="px M btn" type="button" style="--fill:var(--cream)">Clear amounts</button>
      </div>
      <div class="cols" id="cols"></div>
    </div>
  </section>

  <section class="px L panel" data-panel="results" style="--fill:var(--peach)">
    <div class="gi-in">
      <div class="px L pill">2. Who pays whom</div>
      <div class="px M summary" id="summary" hidden></div>
      <ul id="settle"><li class="px M">Type the amounts above.</li></ul>
    </div>
  </section>
</main>

<dialog id="pv" class="px L preview" aria-labelledby="pv-title">
  <div class="px L pill" id="pv-title">Preview</div>
  <div id="pv-link">
    <div class="px M field"><textarea id="pv-url" rows="4" readonly aria-label="Share link"></textarea></div>
    <p class="hint" id="pv-info"></p>
    <a id="pv-open" class="px M btn" target="_blank" rel="noopener" style="--fill:var(--cream)">Open in new tab</a>
  </div>
  <div id="pv-img" class="px M pic" hidden><img id="pv-pic" alt="Preview of the exported picture"></div>
  <div class="pv-actions">
    <button id="pv-close" class="px M btn" type="button" style="--fill:var(--cream)">Cancel</button>
    <button id="pv-go" class="px M btn blue" type="button">Copy</button>
  </div>
</dialog>

<div id="toast" class="px M toast" role="status" hidden></div>

<script src="script.js"></script>
</body>
</html>
